global:
  scrape_interval:     15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: [ 'localhost:9090' ]
  - job_name: 'tempo'
    static_configs:
      - targets: [ 'tempo:3200' ]
  - job_name: 'otel-collector'
    static_configs:
      - targets: [ 'otel-collector:8889' ]
  - job_name: 'shopware_prom_exp'
    metrics_path: '/api/_internal/prometheus'
    static_configs:
      - targets: [ 'host.docker.internal:8000' ]

